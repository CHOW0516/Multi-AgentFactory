# Local stack. Every port listens on this computer only (127.0.0.1), so nobody else on the network
# can reach the database, queue or mail server. Start what exists on your branch, for example:
#   docker compose up -d postgres rabbitmq greenmail api
#   docker compose run --rm migrate && docker compose run --rm seed
name: factory-commit

x-backend: &backend
  build: ./backend
  image: factory-commit-backend
  env_file: .env
  volumes:
    - documents:/data/documents
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factory}
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-factory}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      # ping passes before the AMQP port accepts connections; check the port so agents do not start too early.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=orders:${IMAP_PASSWORD:-change-me}@factory.local -Dgreenmail.users.login=email
    ports: ["127.0.0.1:3025:3025", "127.0.0.1:3143:3143"]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles: ["tools"]

  seed:
    <<: *backend
    command: ["python", "-m", "app.simulator", "seed"]
    restart: "no"
    profiles: ["tools"]

  api:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"]   # API_BIND_ADDRESS=0.0.0.0 to reach it from other computers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  orchestrator:
    <<: *backend
    command: ["python", "-m", "app.orchestrator"]

  agent-order:
    <<: *backend
    command: ["python", "-m", "app.agents.order"]

  agent-material:
    <<: *backend
    command: ["python", "-m", "app.agents.material"]

  agent-planning:
    <<: *backend
    command: ["python", "-m", "app.agents.planning"]

  agent-quality:
    <<: *backend
    command: ["python", "-m", "app.agents.quality"]

  agent-monitoring:
    <<: *backend
    command: ["python", "-m", "app.agents.monitoring"]

  agent-maintenance:
    <<: *backend
    command: ["python", "-m", "app.agents.maintenance"]

  simulator:
    <<: *backend
    command: ["python", "-m", "app.simulator", "run"]
    restart: "no"

  backup:
    image: postgres:16-alpine          # same pg_dump version as the database; busybox crond for BACKUP_CRON
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-factory}
      PGUSER: ${POSTGRES_USER:-factory}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_PATH: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 * * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-72}
      DOCUMENTS_PATH: /data/documents
    volumes:
      - ./backups:/backups               # dumps land in ./backups on the host
      - documents:/data/documents:ro     # PO files are backed up with the database
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    entrypoint: ["/scripts/backup.sh"]
    command: ["schedule"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  documents:
